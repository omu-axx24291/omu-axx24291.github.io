<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>おすすめの旅行先</title>
</head>
<body>
  <h2>BMI指標計算</h2>

<form oninput="bmi.value =
    Math.round(Number(weight.value) /
    Math.pow(Number(height.value) / 100, 2) * 10) / 10">

    <p>
        <label>
            体重(kg)：
            <input name="weight" type="number" step="any">
        </label>
    </p>

    <p>
        <label>
            身長(cm)：
            <input name="height" type="number" step="any">
        </label>
    </p>

    <p>
        <label>
            BMI：
            <output name="bmi"></output>
        </label>
    </p>
</form>
  
  <p>Webシステム構築基礎 第2回課題</p>
  <p>田渕翔都 AAA24291</p>

  <h1>おすすめの旅行先</h1>

</body>
</html>
