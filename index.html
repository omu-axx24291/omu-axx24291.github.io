<h2>現在時刻</h2>
<p id="clock" style="font-size: 28px; font-weight: bold;"></p>

<script>
function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString("ja-JP", { hour12: false });
}

updateClock();
setInterval(updateClock, 1000);
</script>
